{% extends "base/base.html" %}

{% block auth_content %}
<div class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-900 to-nexus-900 flex items-center justify-center p-4">
  <div class="w-full max-w-md">

    <!-- Logo & header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-nexus-600 rounded-2xl mb-4 shadow-lg">
        <i class="ti ti-building-skyscraper text-white text-3xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-white">Nexus-01 ERP</h1>
      <p class="text-gray-400 text-sm mt-1">Masuk ke sistem</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
      <div class="px-8 pt-8 pb-6">
        <h2 class="text-lg font-semibold text-gray-900 mb-6">Login</h2>

        {% if form.errors %}
        <div class="mb-4 flex items-center gap-2 px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">
          <i class="ti ti-circle-x text-red-500"></i>
          Username atau password salah. Coba lagi.
        </div>
        {% endif %}

        <form method="post" class="space-y-4">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
            <div class="relative">
              <i class="ti ti-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <input type="text" name="username" autofocus required
                     class="w-full pl-9 pr-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-nexus-500 focus:border-transparent transition"
                     placeholder="username">
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
            <div class="relative" x-data="{ show: false }">
              <i class="ti ti-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <input :type="show ? 'text' : 'password'" name="password" required
                     class="w-full pl-9 pr-10 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-nexus-500 focus:border-transparent transition"
                     placeholder="••••••••">
              <button type="button" @click="show = !show"
                      class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                <i class="ti" :class="show ? 'ti-eye-off' : 'ti-eye'"></i>
              </button>
            </div>
          </div>

          <button type="submit"
                  class="w-full bg-nexus-600 hover:bg-nexus-700 text-white font-medium py-2.5 rounded-lg text-sm transition duration-150 mt-2 flex items-center justify-center gap-2">
            <i class="ti ti-login"></i>
            Masuk
          </button>
        </form>
      </div>

      <div class="px-8 py-4 bg-gray-50 border-t border-gray-100 text-center">
        <p class="text-xs text-gray-400">Nexus-01 ERP v{{ NEXUS_VERSION }}</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
