{% extends "base/base.html" %}
{% load nexus_tags %}
{% block breadcrumb %}{% breadcrumb "Finance" "Expense" "Catat" %}{% endblock %}
{% block content %}
<div class="max-w-lg">
  <form method="post" class="space-y-5">
    {% csrf_token %}
    <div class="bg-white rounded-xl border border-gray-200 p-5 space-y-4">
      <h3 class="text-sm font-semibold text-gray-900 border-b border-gray-100 pb-3">Catat Pengeluaran</h3>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Judul <span class="text-red-500">*</span></label>
        <input type="text" name="title" required placeholder="Deskripsi pengeluaran"
               class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-nexus-400 transition">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Kategori</label>
        <select name="category" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-nexus-400 bg-white">
          {% for val, label in categories %}
          <option value="{{ val }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Jumlah <span class="text-red-500">*</span></label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">Rp</span>
          <input type="number" name="amount" step="1" min="1" required
                 class="w-full pl-9 pr-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-nexus-400 transition font-mono"
                 placeholder="0">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Tanggal</label>
        <input type="date" name="expense_date"
               class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-nexus-400 transition">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Keterangan</label>
        <textarea name="description" rows="3" placeholder="Detail pengeluaran..."
                  class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-nexus-400 transition resize-none"></textarea>
      </div>
    </div>

    <div class="flex justify-between">
      <a href="{% url 'finance:expense_list' %}" class="px-4 py-2 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-50 transition">Batal</a>
      <button type="submit" class="px-5 py-2 bg-nexus-600 hover:bg-nexus-700 text-white rounded-lg text-sm font-medium transition flex items-center gap-2">
        <i class="ti ti-check"></i> Simpan Expense
      </button>
    </div>
  </form>
</div>
{% endblock %}
